<div class="card mb-3 tf-game-card tf-verb-host" style="--tf-verb-color: {{ include.page.verb_color | default: 'var(--bs-gray-600)' }}">
  {% include games/verb.html page=include.page %}
  <div class="tf-game-card-body">
    <img src="{{ site.baseurl }}/{{ include.page.image }}" class="tf-game-thumb" alt="">
    <div class="tf-game-card-text">
      <div class="card-body">
        <div class="tf-game-card-head">
          <h5 class="card-title mb-0 tf-game-card-title"><a href="{{ site.baseurl }}{{ include.page.url }}" class="stretched-link text-reset text-decoration-none">{{ include.page.title }}</a></h5>
          <small class="text-muted text-nowrap">{{ include.page.date }}</small>
        </div>
        <div class="tf-game-card-summary"><p class="card-text">{{ include.page.summary }}</p></div>
        {% if include.page.genres %}
        <div class="tf-game-card-labels">
          {% for genre in include.page.genres %}<span class="tf-genre">{{ genre }}</span>{% endfor %}
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
